<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canarias Construcciones — Mural 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&family=Share+Tech+Mono&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFE500;--black:#1A1A1A;--bg:#111111;--lgray:#898A8D;--green:#00DD55;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Raleway',sans-serif;color:#fff;}

/* ══════════════════════════════════
   HEADER — dark bg, all text legible
══════════════════════════════════ */
header{
  position:fixed;top:0;left:0;right:0;z-index:200;height:64px;
  background:#0e0c09;
  border-bottom:3px solid var(--yellow);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;gap:12px;
  box-shadow:0 4px 40px rgba(0,0,0,.95);
}

/* LOGO */
.logo{flex-shrink:0;display:flex;align-items:center;}
.logo img{height:40px;width:auto;display:block;}

/* DIVIDER */
.hdiv{width:1px;height:36px;background:rgba(255,229,0,.3);flex-shrink:0;}

/* LIVE badge */
.live-badge{
  display:flex;align-items:center;gap:5px;flex-shrink:0;
  background:rgba(0,221,85,.1);
  border:1px solid rgba(0,221,85,.35);
  padding:3px 10px 3px 8px;border-radius:2px;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;
  box-shadow:0 0 6px var(--green);
  animation:livePulse 1.4s ease-in-out infinite;
}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 6px var(--green)}50%{opacity:.5;box-shadow:0 0 14px var(--green)}}
.live-txt{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--green);letter-spacing:2px;font-weight:700;}

/* NASA CLOCK */
.nasa-clock{
  display:flex;flex-direction:column;align-items:center;flex-shrink:0;
  font-family:'Share Tech Mono',monospace;
  border:1px solid rgba(255,229,0,.2);
  background:rgba(255,229,0,.04);
  padding:4px 14px;border-radius:1px;
}
.clock-time{font-size:24px;color:var(--yellow);letter-spacing:4px;line-height:1;}
.clock-date{font-size:9px;color:#ddd;letter-spacing:2px;margin-top:2px;text-transform:uppercase;}

/* WEATHER */
.weather{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.15);
  padding:4px 12px;border-radius:1px;
}
.w-icon{font-size:22px;}
.w-info{display:flex;flex-direction:column;}
.w-temp{font-size:20px;font-weight:800;color:#fff;line-height:1;}
.w-desc{font-size:9px;color:#ddd;text-transform:uppercase;letter-spacing:1px;}
.w-loc{font-size:8px;color:#aaa;}
.w-sep{width:1px;height:28px;background:rgba(255,255,255,.2);}
.w-forecast{display:flex;gap:8px;align-items:center;}
.w-day{display:flex;flex-direction:column;align-items:center;gap:1px;}
.w-day-icon{font-size:13px;}
.w-day-lbl{font-size:8px;color:#ccc;letter-spacing:.5px;}
.w-day-t{font-family:'Share Tech Mono',monospace;font-size:10px;color:#fff;}

/* HUD PILLS */
.hud{display:flex;align-items:center;gap:10px;}
.hpill{
  display:flex;flex-direction:column;align-items:center;
  border:1px solid rgba(255,255,255,.2);padding:3px 12px;border-radius:1px;
}
.hn{font-family:'Share Tech Mono',monospace;font-size:22px;color:var(--yellow);line-height:1;}
.hl{font-size:8px;color:#ccc;text-transform:uppercase;letter-spacing:1px;margin-top:1px;}

/* TODAY pill */
.today-pill{
  display:flex;flex-direction:column;align-items:center;
  border:1px solid rgba(255,229,0,.3);padding:3px 12px;border-radius:1px;
  background:rgba(255,229,0,.06);
}
.today-n{font-family:'Share Tech Mono',monospace;font-size:22px;color:var(--yellow);line-height:1;}
.today-l{font-size:8px;color:var(--yellow);text-transform:uppercase;letter-spacing:1px;margin-top:1px;}

/* FALLING pill */
.apill{
  display:flex;align-items:center;gap:6px;
  border:1px solid rgba(0,221,85,.2);padding:3px 12px;border-radius:1px;
  background:rgba(0,221,85,.04);
}
.adot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:livePulse 2s ease-in-out infinite;}

/* SYNC */
.sync-pill{
  display:flex;align-items:center;gap:5px;
  border:1px solid rgba(255,255,255,.06);padding:3px 10px;border-radius:1px;
  flex-shrink:0;cursor:pointer;transition:border-color .2s;
}
.sync-pill:hover{border-color:rgba(255,229,0,.3);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#3a3a3a;transition:background .3s;}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:#cc2222;}
.sync-dot.spin{background:var(--yellow);animation:livePulse 1s infinite;}
.sync-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:#ccc;letter-spacing:.5px;white-space:nowrap;}

/* YEAR RING */
.ring-wrap{position:relative;width:44px;height:44px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.rbg{fill:none;stroke:#222;stroke-width:4;}
.rfill{fill:none;stroke:var(--yellow);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .8s;}
.rpct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rpct-n{font-family:'Share Tech Mono',monospace;font-size:10px;font-weight:700;color:var(--yellow);line-height:1;}
.rpct-y{font-size:7px;color:#bbb;letter-spacing:.5px;}

/* ══════════════════════════════════
   SCENE
══════════════════════════════════ */
#scene{
  position:fixed;top:64px;left:0;right:0;bottom:0;overflow:hidden;
  background:var(--bg);
}
#scene::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,229,0,.018) 39px,rgba(255,229,0,.018) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,229,0,.013) 39px,rgba(255,229,0,.013) 40px);
}
.yr{
  position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
  font-family:'Raleway',sans-serif;font-size:clamp(80px,16vw,200px);font-weight:900;
  color:rgba(255,229,0,.018);letter-spacing:8px;
  pointer-events:none;user-select:none;z-index:0;white-space:nowrap;
}

/* ══════════════════════════════════
   TODAY ZONE — subtle glow band at
   the top of the pile showing where
   today's cards land
══════════════════════════════════ */
#today-zone{
  position:absolute;bottom:24px;left:0;right:0;
  pointer-events:none;z-index:8;
  /* Height updated dynamically by JS */
  background:linear-gradient(to top,
    rgba(255,229,0,.07) 0%,
    rgba(255,229,0,.03) 60%,
    transparent 100%);
  border-top:1px dashed rgba(255,229,0,.25);
  transition:height .8s ease;
}
#today-label{
  position:absolute;top:-18px;left:12px;
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:rgba(255,229,0,.5);
  letter-spacing:2px;text-transform:uppercase;
  pointer-events:none;
}

/* ══════════════════════════════════
   FLOOR
══════════════════════════════════ */
#floor-vis{
  position:absolute;bottom:0;left:0;right:0;height:24px;z-index:15;
  background:linear-gradient(180deg,#222 0%,#111 100%);
  border-top:3px solid var(--yellow);
}
#floor-vis::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:rgba(255,229,0,.35);}
#floor-vis::after{content:'';position:absolute;top:-24px;left:0;right:0;height:24px;background:linear-gradient(to top,rgba(0,0,0,.3),transparent);pointer-events:none;}
.chevrons{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;gap:4px;overflow:hidden;opacity:.18;}
.chev{font-size:10px;color:var(--yellow);font-weight:900;letter-spacing:-2px;}

/* ══════════════════════════════════
   STICKY — base style
══════════════════════════════════ */
.sticky{
  position:absolute;font-family:'Caveat',cursive;border-radius:1px;
  padding:8px 10px 9px;--fold:10px;
  clip-path:polygon(0 0,calc(100% - var(--fold)) 0,100% var(--fold),100% 100%,0 100%);
  user-select:none;cursor:default;
  box-shadow:1px 3px 12px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.08) inset;
  transition:box-shadow .15s;
}
.sticky::after{content:'';position:absolute;top:0;right:0;width:var(--fold);height:var(--fold);background:rgba(0,0,0,.18);clip-path:polygon(100% 0,0 0,100% 100%);}
.sticky::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:24px;height:9px;background:rgba(255,255,255,.35);border-radius:1px;z-index:3;}
.sticky:hover{z-index:9999!important;filter:brightness(1.08);box-shadow:2px 8px 24px rgba(0,0,0,.8);}

/* TODAY cards — extra glow + yellow ring */
.sticky.today-card{
  box-shadow:
    1px 3px 12px rgba(0,0,0,.7),
    0 0 0 2px rgba(255,229,0,.6),
    0 0 16px rgba(255,229,0,.25);
}
.sticky.today-card::before{
  background:rgba(255,229,0,.55);/* brighter tape for today */
}

/* Card content */
.sn{font-size:var(--fs);font-weight:700;line-height:1.2;word-break:break-word;padding-right:6px;margin-bottom:3px;}
.smeta{display:flex;flex-direction:column;gap:1px;margin-top:3px;}
.s-project{font-size:9px;font-weight:700;letter-spacing:.2px;font-family:'Raleway',sans-serif;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:3px;}
.s-date{font-size:9px;font-family:'Share Tech Mono',monospace;opacity:.5;}
.sav{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:60%;}
.sav-chip{height:15px;border-radius:20px;padding:0 5px;display:flex;align-items:center;font-size:7px;font-weight:800;color:#fff;font-family:'Raleway',sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;}

/* today badge on card */
.today-badge{
  position:absolute;top:-8px;right:14px;
  background:var(--yellow);color:#111;
  font-family:'Raleway',sans-serif;font-size:7px;font-weight:900;
  padding:1px 5px;letter-spacing:.5px;text-transform:uppercase;
  border-radius:2px;z-index:4;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}

/* countdown badge */
.ctbadge{
  position:absolute;background:rgba(15,13,9,.92);
  border:1px solid rgba(255,229,0,.5);color:var(--yellow);
  font-family:'Share Tech Mono',monospace;font-size:9px;
  padding:1px 7px;border-radius:20px;letter-spacing:.4px;
  pointer-events:none;z-index:60;white-space:nowrap;transform:translateX(-50%);
}

/* dust */
.dp{position:absolute;width:3px;height:3px;border-radius:50%;background:#4a4a3a;pointer-events:none;z-index:20;animation:dpA .55s ease-out forwards;}
@keyframes dpA{from{opacity:.8;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
.squash{transition:transform .35s cubic-bezier(.34,1.56,.64,1);}

/* toast */
.toast{position:fixed;bottom:14px;right:14px;background:var(--yellow);color:var(--black);padding:8px 14px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);opacity:0;transform:translateY(10px);transition:all .24s;pointer-events:none;z-index:500;}
.toast.show{opacity:1;transform:none;}
</style>
</head>

<header>
  <!-- LOGO -->
  <div class="logo">
    <img id="logoImg" src="" alt="Canarias Construcciones"/>
  </div>

  <div class="hdiv"></div>

  <!-- LIVE -->
  <div class="live-badge">
    <div class="live-dot"></div>
    <span class="live-txt">EN VIVO</span>
  </div>

  <!-- CLOCK -->
  <div class="nasa-clock">

  <div class="hdiv"></div>

  <!-- HUD -->
  <div class="hud">

    </div>
    <div class="ring-wrap" title="% del año 2026 transcurrido">

      </svg>
      <div class="rpct">
        <span class="rpct-n" id="rPct">0%</span>
        <span class="rpct-y">2026</span>
      </div>
    </div>
  </div>
</header>

<div id="scene">
  <div class="yr">2026</div>
  <div id="today-zone" style="height:0px">
    <div id="today-label">— HOY —</div>
  </div>
  <div id="floor-vis">
    <div class="chevrons">
      <span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span><span class="chev">&raquo;</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function todayStr(){
  const n=new Date();
  return `${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`;
}
function isToday(dateStr){
  // dateStr format: "22/04/2026"
  return dateStr===todayStr();
}

════════════════════════════════ */
let S=(()=>{try{return JSON.parse(localStorage.getItem(STORE))||null;}catch(e){return null;}})()
    ||{landed:[],falling:[],zCtr:10};
const knownIds=new Set([...S.landed.map(t=>t.id),...S.falling.map(t=>t.id)]);
const flying={};
let grid={};
let lastRaf=0;

/* ════════════════════════════════
   UTILS
════════════════════════════════ */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const scW=()=>document.getElementById('scene').clientWidth;
const scH=()=>document.getElementById('scene').clientHeight;
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}};
const fmtMs=(ms)=>{const s=Math.round(ms/1000);if(s<60)return s+'s';if(s<3600)return Math.round(s/60)+'min';return (s/3600).toFixed(1)+'h';};
const randDur=()=>{const lo=Math.log(120),hi=Math.log(14400);return Math.round(Math.exp(lo+Math.random()*(hi-lo)))*1000;};
const avColor=(s='')=>{let h=0;for(const c of s)h=c.charCodeAt(0)+h*31;return AVC[Math.abs(h)%AVC.length];};
function sr(id,k,a,b){let h=0;const s=id+k;for(let i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return a+((h>>>0)%1000)/1000*(b-a);}
const szO=(id)=>SIZES.find(s=>s.id===id)||SIZES[1];

/* ════════════════════════════════
   CSV PARSER
════════════════════════════════ */
function parseCSV(text){
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(inQ){if(c==='"'&&n==='"'){cur+='"';i++;}else if(c==='"')inQ=false;else cur+=c;}
    else{if(c==='"')inQ=true;else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||(c==='\r'&&n==='\n')){if(c==='\r')i++;row.push(cur);cur='';if(row.some(x=>x!=''))rows.push(row);row=[];}
    else cur+=c;}
  }
  if(cur||row.length)row.push(cur);if(row.some(x=>x!=''))rows.push(row);return rows;
}

/* ════════════════════════════════
   ROW → TASK
   0 ID Tarea
   1 Nombre
   2 Fecha completado  "22/04/2026 13:30"
   3 Fecha agregado
   4 Asignado a
   5 Space
   6 Lista/Proyecto
   7 Prioridad
   8 Estado
   9 URL
════════════════════════════════ */
function rowToTask(row){
  const id      =(row[0]||'').trim();
  const name    =(row[1]||'').trim();
  const date    =(row[2]||'').trim();
  const assignRaw=(row[4]||'').trim();
  const project =(row[6]||'').trim();
  const prioRaw =(row[7]||'').trim();
  const estado  =(row[8]||'').trim().toLowerCase();
  if(!id||!name)return null;
  if(estado!=='completada'&&estado!=='completed'&&estado!=='done')return null;
  const assignees=assignRaw==='Sin asignar'||!assignRaw?[]:assignRaw.split(',').map(a=>a.trim()).filter(Boolean);
  const dateFmt=date?date.split(' ')[0]:'';
  return{id,name,date:dateFmt,assignees,project,prioRaw};
}

/* ════════════════════════════════
   CLOCK
════════════════════════════════ */
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONS=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
function tickClock(){
  const n=new Date();
  document.getElementById('clockTime').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  document.getElementById('clockDate').textContent=`${DAYS[n.getDay()]}  ${String(n.getDate()).padStart(2,'0')} ${MONS[n.getMonth()]} ${n.getFullYear()}`;
}
setInterval(tickClock,1000);tickClock();

/* ════════════════════════════════
   HUD
════════════════════════════════ */
function updateHUD(){
  document.getElementById('cN').textContent=S.landed.length;
  document.getElementById('aN').textContent=Object.keys(flying).length;
  const todayCount=S.landed.filter(t=>isToday(t.date)).length;
  document.getElementById('todayN').textContent=todayCount;
  const now=new Date();let pct=0;
  if(now.getFullYear()===YEAR)pct=clamp((now-new Date(YEAR,0,1))/(new Date(YEAR,11,31,23,59,59)-new Date(YEAR,0,1)),0,1);
  else if(now.getFullYear()>YEAR)pct=1;
  const R=18,C=2*Math.PI*R;
  document.getElementById('rFill').style.strokeDasharray=C;
  document.getElementById('rFill').style.strokeDashoffset=C*(1-pct);
  document.getElementById('rPct').textContent=Math.round(pct*100)+'%';
  updateTodayZone();
}

/* ════════════════════════════════
   TODAY ZONE
   Shows a glowing band at the top
   of today's pile layer so you can
   see at a glance what fell today.
   The band height = today's card rows * cardH
════════════════════════════════ */
function updateTodayZone(){
  const todayCards=S.landed.filter(t=>isToday(t.date));
  if(todayCards.length===0){
    document.getElementById('today-zone').style.height='0px';
    return;
  }
  // Find max landRow among today's cards
  const maxRow=Math.max(...todayCards.map(t=>t.landRow||0));
  const avgH=64; // average card height
  const zoneH=(maxRow+1)*(avgH+CARD_GAP)+16;
  document.getElementById('today-zone').style.height=zoneH+'px';
  const count=todayCards.length;
  document.getElementById('today-label').textContent=`— HOY: ${count} tarea${count>1?'s':''} —`;
}

/* ════════════════════════════════
   SYNC
════════════════════════════════ */
function setSyncStatus(state,label){
  document.getElementById('syncDot').className='sync-dot '+(state||'');
  document.getElementById('syncLbl').textContent=label||'--';
}

async function syncNow(){
  setSyncStatus('spin','Sincronizando...');
  try{
    const resp=await fetch(CSV_URL,{cache:'no-cache'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const text=await resp.text();

    // Debug
    const rawRows=text.split('\n').slice(0,4);
    console.log('=== CSV DEBUG ===');
    rawRows.forEach((r,i)=>console.log(`Fila ${i}:`,r));

    const rows=parseCSV(text);
    console.log('Parsed rows:',rows.length,'| Header:',rows[0]);
    if(rows.length<2){setSyncStatus('err','Sin datos');showToast('Sin datos — revisá la hoja publicada');return;}

    let newCount=0;
    for(let i=1;i<rows.length;i++){
      const t=rowToTask(rows[i]);
      if(!t)continue;
      if(knownIds.has(t.id))continue;
      knownIds.add(t.id);newCount++;
      const sizeIdx=Math.abs(sr(t.id,'sz',0,3)|0)%3;
      t.sizeId=SIZES[sizeIdx].id;
      t.fallDurMs=randDur();
      t.startedAt=Date.now()+newCount*200;
      reserveSpot(t);
      S.falling.push(t);
      setTimeout(()=>launchCard(t),newCount*180);
    }
    save();updateHUD();
    const timeStr=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok','Sync '+timeStr);
    if(newCount>0)showToast(`» ${newCount} tarea${newCount>1?'s':''} nueva${newCount>1?'s':''}`);
    else if(rows.length>=2)showToast(`» ${rows.length-1} filas leídas — revisá col. Estado`);
  }catch(err){
    console.error('Sync error',err);
    setSyncStatus('err','Error: '+err.message);
    showToast('Error: '+err.message);
  }
}

/* ════════════════════════════════
   PILE GRID
════════════════════════════════ */
function numCols(){return Math.floor(scW()/GRID_W);}
function rebuildGrid(){
  grid={};
  [...S.landed,...S.falling.filter(f=>f.landCol!==undefined)].forEach(t=>{
    const sz=szO(t.sizeId),span=Math.ceil(sz.w/GRID_W);
    for(let i=0;i<span;i++){const c=(t.landCol||0)+i;grid[c]=Math.max(grid[c]||0,(t.landRow||0)+1);}
  });
}
function pickCol(sz){
  const total=numCols(),span=Math.ceil(sz.w/GRID_W),maxStart=Math.max(0,total-span);
  let minH=Infinity,best=[];
  for(let s=0;s<=maxStart;s++){let h=0;for(let i=0;i<span;i++)h=Math.max(h,grid[s+i]||0);if(h<minH){minH=h;best=[s];}else if(h===minH)best.push(s);}
  const base=best[Math.floor(Math.random()*best.length)];
  return clamp(base+Math.round(rnd(-2,2)),0,maxStart);
}
function reserveSpot(t){
  const sz=szO(t.sizeId),span=Math.ceil(sz.w/GRID_W);
  const col=pickCol(sz);let row=0;
  for(let i=0;i<span;i++)row=Math.max(row,grid[col+i]||0);
  for(let i=0;i<span;i++)grid[col+i]=row+1;
  t.landCol=col;t.landRow=row;
  t.landX=clamp(col*GRID_W+rnd(-3,3),2,scW()-sz.w-2);
  t.landRf=rnd(-11,11);
}
function finalTop(t){
  const sz=szO(t.sizeId);
  return scH()-FLOOR_H-(t.landRow||0)*(sz.h+CARD_GAP)-sz.h;
}

/* ════════════════════════════════
   CARD HTML
════════════════════════════════ */
function cardInner(t){
  const ps=prioStyle(t.prioRaw);
  const shown=t.assignees.slice(0,2);
  const chips=shown.map(a=>{
    const initials=a.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    return `<div class="sav-chip" style="background:${avColor(a)}" title="${a}">${initials}</div>`;
  }).join('');
  const todayBadge=isToday(t.date)?'<div class="today-badge">HOY</div>':'';
  return `${todayBadge}
    <div class="sn" style="color:${ps.textColor}">${t.name}</div>
    <div class="smeta">
      <div class="s-project" style="color:${ps.textColor}">${t.project||''}</div>
      <div class="s-bottom">
        <div class="s-date" style="color:${ps.textColor};opacity:.45">${t.date||''}</div>
        <div class="sav">${chips}</div>
      </div>
    </div>`;
}

/* ════════════════════════════════
   SWAY
════════════════════════════════ */
function swayP(id){return{
  a1:sr(id,'a1',16,52),f1:sr(id,'f1',.04,.14),p1:sr(id,'p1',0,6.28),
  a2:sr(id,'a2', 5,20),f2:sr(id,'f2',.1, .28),p2:sr(id,'p2',0,6.28),
  a3:sr(id,'a3', 2, 8),f3:sr(id,'f3',.25,.55),p3:sr(id,'p3',0,6.28),
  ra:sr(id,'ra', 4,13),rf_:sr(id,'rf',.04,.13),rp:sr(id,'rp',0,6.28),
  drift:sr(id,'dr',-38,38),
};}
function easeOut(t){return 1-Math.pow(1-t,3);}

/* ════════════════════════════════
   LAUNCH
════════════════════════════════ */
function launchCard(t){
  const sz=szO(t.sizeId),ps=prioStyle(t.prioRaw);
  const zIdx=++S.zCtr;t._zIdx=zIdx;
  const el=document.createElement('div');
  el.className='sticky'+(isToday(t.date)?' today-card':'');
  el.id='c-'+t.id;
  el.style.cssText=`width:${sz.w}px;--fs:${sz.fs};background:${ps.hex};z-index:${zIdx};left:0;top:-100px;opacity:0;`;
  el.innerHTML=cardInner(t);
  const badge=document.createElement('div');
  badge.className='ctbadge';badge.id='badge-'+t.id;
  const sc=document.getElementById('scene');
  sc.insertBefore(el,document.getElementById('floor-vis'));
  sc.insertBefore(badge,document.getElementById('floor-vis'));
  flying[t.id]={el,badge,task:t,sway:swayP(t.id),startX:rnd(10,scW()-sz.w-10)};
}

/* ════════════════════════════════
   RESTORE LANDED
════════════════════════════════ */
function placeLanded(lt){
  const sz=szO(lt.sizeId),ps=prioStyle(lt.prioRaw);
  const topPx=scH()-FLOOR_H-(lt.landRow||0)*(sz.h+CARD_GAP)-sz.h;
  const el=document.createElement('div');
  el.className='sticky'+(isToday(lt.date)?' today-card':'');
  el.id='c-'+lt.id;
  el.style.cssText=`width:${sz.w}px;--fs:${sz.fs};background:${ps.hex};transform:rotate(${lt.landRf}deg);z-index:${lt.zIndex||5};left:${lt.landX}px;top:${topPx}px;`;
  el.innerHTML=cardInner(lt);
  document.getElementById('scene').insertBefore(el,document.getElementById('floor-vis'));
}

/* ════════════════════════════════
   RAF LOOP
════════════════════════════════ */
function tick(now){
  requestAnimationFrame(tick);
  if(now-lastRaf<30)return;lastRaf=now;
  const nowMs=Date.now(),toLand=[];
  for(const [id,f] of Object.entries(flying)){
    const{el,badge,task,sway,startX}=f;
    const elapsed=nowMs-task.startedAt;
    const progress=clamp(elapsed/task.fallDurMs,0,1);
    if(progress>=1){toLand.push(id);continue;}
    const sz=szO(task.sizeId);
    const ft=finalTop(task);
    const startTopPx=-sz.h-12;
    const curTop=startTopPx+(ft-startTopPx)*easeOut(progress);
    const sec=elapsed/1000;
    const sX=sway.a1*Math.sin(sway.f1*sec+sway.p1)+sway.a2*Math.sin(sway.f2*sec+sway.p2)+sway.a3*Math.sin(sway.f3*sec+sway.p3)+sway.drift*progress;
    const curLeft=clamp(startX+sX,3,scW()-sz.w-3);
    const swR=sway.ra*Math.sin(sway.rf_*sec+sway.rp);
    const settle=clamp((progress-.85)/.15,0,1);
    const curRot=swR*(1-settle)+task.landRf*settle;
    const opacity=clamp(progress/.04,0,1);
    el.style.top=curTop+'px';el.style.left=curLeft+'px';
    el.style.transform=`rotate(${curRot}deg)`;el.style.opacity=opacity;
    const rem=Math.max(0,task.fallDurMs-elapsed);
    badge.style.left=(curLeft+sz.w/2)+'px';badge.style.top=Math.max(curTop-20,4)+'px';
    badge.style.opacity=opacity;badge.textContent='⬇ '+fmtMs(rem);
    badge.style.color=rem<15000?'#FFE500':'rgba(255,229,0,.6)';
  }
  for(const id of toLand)landCard(id);
}

/* ════════════════════════════════
   LAND
════════════════════════════════ */
function landCard(id){
  const f=flying[id];if(!f)return;
  const{el,badge,task}=f;
  const sz=szO(task.sizeId);
  const ft=finalTop(task),fl=clamp(task.landX,3,scW()-sz.w-3);
  if(badge.parentNode)badge.remove();
  el.style.top=ft+'px';el.style.left=fl+'px';el.style.opacity='1';
  el.style.transform=`rotate(${task.landRf}deg) scaleY(.83) scaleX(1.1)`;
  setTimeout(()=>{el.classList.add('squash');el.style.transform=`rotate(${task.landRf}deg)`;},20);
  spawnDust(fl+sz.w/2,ft+sz.h);
  S.landed.push({id:task.id,name:task.name,date:task.date,assignees:task.assignees,project:task.project,prioRaw:task.prioRaw,sizeId:task.sizeId,landCol:task.landCol,landRow:task.landRow,landX:fl,landRf:task.landRf,zIndex:task._zIdx||S.zCtr});
  S.falling=S.falling.filter(f=>f.id!==id);
  delete flying[id];save();updateHUD();
}

function spawnDust(cx,cy){
  const sc=document.getElementById('scene');
  for(let i=0;i<8;i++){
    const p=document.createElement('div');p.className='dp';
    p.style.left=(cx+rnd(-22,22))+'px';p.style.top=cy+'px';
    p.style.setProperty('--dx',rnd(-30,30)+'px');p.style.setProperty('--dy',rnd(-14,-4)+'px');
    p.style.animationDelay=rnd(0,.1)+'s';sc.appendChild(p);
    p.addEventListener('animationend',()=>p.remove());
  }
}

let _tt;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3500);}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
function init(){
  requestAnimationFrame(()=>{
    rebuildGrid();
    S.landed.forEach(lt=>placeLanded(lt));
    const nowMs=Date.now();
    S.falling.forEach(ft=>{
      if(ft.landCol===undefined)reserveSpot(ft);
      if(nowMs-ft.startedAt>=ft.fallDurMs)ft.startedAt=nowMs-ft.fallDurMs+80;
      launchCard(ft);
    });
    updateHUD();
    requestAnimationFrame(tick);
    syncNow();
    setInterval(syncNow,SYNC_MS);
    setInterval(updateHUD,60000);
  });
}

init();
</script>
